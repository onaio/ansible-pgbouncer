---
- name: Pause connections to the master db before restarting service
  tags:
    - pgbouncer
    - pgbouncer-pause
  ansible.builtin.raw: "PGPASSWORD={{ pgsql_password }} /usr/bin/psql -U {{ pgsql_user }} -h 127.0.0.1 -p 6432 -c \"PAUSE;\" pgbouncer"
  register: pgbouncer_pause
  changed_when: pgbouncer_pause.rc == 0

- name: Reload pgbouncer
  tags: pgbouncer
  ansible.builtin.service:
    name: pgbouncer
    state: reloaded
    enabled: true

- name: Resume connections to the master db before restarting service
  tags:
    - pgbouncer
    - pgbouncer-resume
  ansible.builtin.raw: "PGPASSWORD={{ pgsql_password }} /usr/bin/psql -U {{ pgsql_user }} -h 127.0.0.1 -p 6432 -c \"RESUME;\" pgbouncer"
  register: pgbouncer_resume
  changed_when: pgbouncer_resume.rc == 0
