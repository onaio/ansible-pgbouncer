---
- name: Make sure the CA certificates are available
  apt:
    pkg: ca-certificates
    state: present

- name: Add PgBouncer repository signing key
  get_url:
    url: "{{ pgbouncer_apt_key_url }}"
    dest: "/etc/apt/trusted.gpg.d/pgdg-{{ pgbouncer_apt_key_id }}.asc"
    owner: root
    group: root
    mode: "0644"
  when:
    - pgbouncer_apt_key_url | default("") | length > 0
    - pgbouncer_apt_key_id | default("") | length > 0
    - pgbouncer_install_repository | bool

- name: Add PgBouncer repository
  apt_repository:
    repo: "{{ pgbouncer_apt_repository }}"
    state: present
  when: pgbouncer_apt_repository | default('') | length != 0 and pgbouncer_install_repository

- name: ensure pgbouncer is installed
  apt:
    pkg: "pgbouncer={{ pgbouncer_version }}"
    state: present
    update_cache: yes
    cache_valid_time: 600
